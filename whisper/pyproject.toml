[tool.uv.workspace]
members = ["packages/*", "apps/*", "workers/*"]

# Virtual workspace root: no [project] of its own, it only ties the members
# together under a single lockfile (uv.lock). Each member declares its own
# dependencies and is built/installed independently (see their pyproject.toml).

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "black>=26.3.1",
    "poethepoet>=0.46.0",
]

[tool.poe.tasks]
vm    = "uvicorn app.main:app"
vmr   = "uvicorn app.main:app --reload"
user  = "uvicorn app.userapp:app"
userr = "uvicorn app.userapp:app --reload"
