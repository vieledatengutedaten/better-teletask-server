[project]
name = "btt-worker-scrape"
version = "0.1.0"
description = "Scrape job worker (local/SLURM). Run with: python -m scrape_worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "btt-core",
    "requests>=2.32",
    "pydantic>=2.12.5",
]

[tool.uv.sources]
btt-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scrape_worker"
module-root = "src"
