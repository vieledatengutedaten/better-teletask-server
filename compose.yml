services:
  # The scheduling VM. Built "fat" (INSTALL_LOCAL=true) so it can run scrape &
  # transcription jobs in-process on this GPU node. For a SLURM-only deployment
  # drop the build arg (slim, no torch) and run the worker images on the cluster.
  scheduler:
    build:
      context: ./whisper
      dockerfile: apps/scheduler/Dockerfile
      args:
        INSTALL_LOCAL: "true"
    environment:
      - TZ=${TZ}
    volumes:
      - ./.env:/app/.env:ro
      - ./whisper/logs:/app/logs
      - "models:/models"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    gpus: all
    stop_signal: SIGINT
    stop_grace_period: 30s

  # Standalone worker images (SLURM / `docker run` use). Not started by default;
  # build them with:  docker compose --profile workers build
  worker-scrape:
    build:
      context: ./whisper
      dockerfile: workers/scrape/Dockerfile
    profiles: ["workers"]
    environment:
      - TZ=${TZ}
    volumes:
      - ./.env:/app/.env:ro

  worker-transcribe:
    build:
      context: ./whisper
      dockerfile: workers/transcribe/Dockerfile
    profiles: ["workers"]
    environment:
      - TZ=${TZ}
    volumes:
      - ./.env:/app/.env:ro
      - "models:/models"
    gpus: all

  api:
    build: ./api
    environment:
      - TZ=${TZ}
    volumes:
      - ./.env:/node/.env:ro
      - ./api/logs:/node/logs
    ports:
    - "80:80"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: postgres:18-alpine
    environment:
      - TZ=${TZ}
      - PGTZ=${TZ}
    env_file: ".env"
    ports:
    - "5432:5432"
    volumes:
      - "pgdata:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 7s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: postgres -c timezone=${TZ}

volumes:
  models:
  pgdata:
